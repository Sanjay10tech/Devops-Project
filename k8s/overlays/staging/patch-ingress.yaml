apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netflow
spec:
  tls:
    - hosts:
        - staging.netflow.example.com
      secretName: netflow-tls-staging
  rules:
    - host: staging.netflow.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
