# Dedicated service accounts per workload (least privilege; no shared identity).
# Do not auto-mount the API token unless a workload needs the API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    app: backend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  labels:
    app: frontend
automountServiceAccountToken: false
---
# Service account used by the External Secrets Operator's SecretStore in this
# namespace. Annotated with the IRSA role ARN provisioned by Terraform
# (aws_iam_role.external_secrets). Overlays patch the real ARN.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  labels:
    app.kubernetes.io/part-of: netflow
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::000000000000:role/netflow-prod-irsa-external-secrets"
