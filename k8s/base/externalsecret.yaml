# Secure secret management (NO plaintext secrets in Git).
#
# The External Secrets Operator reads values from AWS Secrets Manager (using the
# IRSA role on `external-secrets-sa`) and materializes a Kubernetes Secret named
# `backend-secrets`, which the backend Deployment consumes via envFrom.
#
# Only references live in Git — never the secret values themselves.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: backend-secrets          # the k8s Secret that gets created
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: netflow/prod/backend   # Secrets Manager secret id
        property: DB_PASSWORD
    - secretKey: DB_USER
      remoteRef:
        key: netflow/prod/backend
        property: DB_USER
