apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All base resources land in this namespace (overlays may override).
namespace: netflow

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - backend-config.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - service.yaml
  - externalsecret.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

# Logical image names. Overlays (and the CI pipeline) pin these to a registry
# path + immutable tag via `kustomize edit set image`.
images:
  - name: netflow-backend
    newName: netflow-backend
    newTag: 0.0.0-placeholder      # never 'latest'; overlays/CI pin the git SHA
  - name: netflow-frontend
    newName: netflow-frontend
    newTag: 0.0.0-placeholder

labels:
  - pairs:
      app.kubernetes.io/part-of: netflow
    includeSelectors: false
