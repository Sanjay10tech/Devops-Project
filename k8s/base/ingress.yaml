# Ingress routes external traffic: /api -> backend, everything else -> frontend.
# TLS is terminated here using a cert issued by cert-manager (see annotations).
# The hostname and TLS secret are patched per-environment in the overlays.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netflow
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - netflow.example.com
      secretName: netflow-tls
  rules:
    - host: netflow.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
