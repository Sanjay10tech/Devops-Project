# SonarQube scanner configuration (repo root).
# The server URL and token are provided by Jenkins via withSonarQubeEnv /
# the SonarQube server config — never hardcode the token here.

sonar.projectKey=netflow
sonar.projectName=Netflow
sonar.sourceEncoding=UTF-8

# Analyze both apps.
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src
sonar.test.inclusions=backend/src/**/*.test.ts

# Language/tooling.
sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.json

# Coverage (generated by `npm run test:coverage` in the backend).
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Exclusions: build output, deps, generated and non-source files.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.config.js,**/*.config.ts
sonar.coverage.exclusions=**/*.test.ts,**/db/migrate.ts,**/db/seed.ts,**/server.ts
