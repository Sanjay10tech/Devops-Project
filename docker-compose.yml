# Local development orchestration for the Netflix-inspired app.
# Brings up PostgreSQL, runs migrations + seed, then starts backend and frontend.
#
#   docker compose up --build
#
# Configuration comes from environment variables (see .env.example). No secrets
# are baked into images; they are injected at runtime here.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-netflix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-netflix}
      POSTGRES_DB: ${DB_NAME:-netflix}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-netflix} -d ${DB_NAME:-netflix}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot job: apply migrations and seed data, then exit.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: netflix-backend:local
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js"]
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-netflix}
      DB_USER: ${DB_USER:-netflix}
      DB_PASSWORD: ${DB_PASSWORD:-netflix}
      MIGRATIONS_DIR: /app/database/migrations
      SEED_FILE: /app/database/seeds/seed.sql
    volumes:
      # Mount SQL read-only so the image stays lean and secrets-free.
      - ./database:/app/database:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: netflix-backend:local
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-netflix}
      DB_USER: ${DB_USER:-netflix}
      DB_PASSWORD: ${DB_PASSWORD:-netflix}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: netflix-frontend:local
    environment:
      # Nginx proxies /api to this upstream (see frontend/nginx.conf).
      BACKEND_URL: http://backend:4000
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
