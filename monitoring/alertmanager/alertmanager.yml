# Alertmanager routing. Receiver webhooks/keys are injected from a Secret at
# deploy time — do NOT commit real Slack/PagerDuty/email credentials here.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "namespace"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Page on critical alerts; everything else goes to the default channel.
    - matchers:
        - severity = "critical"
      receiver: critical
      repeat_interval: 1h

receivers:
  - name: default
    # Configure a real receiver via a Secret-provided override, e.g. Slack:
    # slack_configs:
    #   - api_url_file: /etc/alertmanager/secrets/slack-url
    #     channel: "#netflow-alerts"

  - name: critical
    # e.g. PagerDuty:
    # pagerduty_configs:
    #   - routing_key_file: /etc/alertmanager/secrets/pagerduty-key

inhibit_rules:
  # A critical alert silences a warning for the same alertname/namespace.
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ["alertname", "namespace"]
