# Secret scanning on every PR and push. Complements (does not replace) the
# Gitleaks stage in the Jenkins pipeline — this gives contributors immediate
# feedback before code reaches Jenkins.

name: Secret Scan

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the scan can inspect all commits
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # No token needed for public repos. For org/private repos add a
          # GITLEAKS_LICENSE secret per the action's documentation.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
