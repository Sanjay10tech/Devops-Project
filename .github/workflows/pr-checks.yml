# Lightweight pull-request checks for fast contributor feedback.
#
# Scope is intentionally minimal: type checking + unit tests + build sanity.
# The full CI/CD pipeline (SonarQube, OWASP Dependency-Check, Trivy image scan,
# ECR push, GitOps bump) lives in Jenkins and is NOT duplicated here.

name: PR Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

# Cancel superseded runs on the same ref.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Use `npm ci` when a lockfile exists, otherwise fall back to install.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
